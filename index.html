
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>চালিয়ে যান</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a1f26;
    font-family: 'Noto Sans Bengali', 'Segoe UI', sans-serif;
  }
  .btn {
    background: linear-gradient(135deg, #e2136e, #ff4f9a);
    color: #fff;
    border: 0;
    padding: 20px 48px;
    border-radius: 14px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 14px 30px -14px rgba(226,19,110,.7);
    transition: transform .15s;
  }
  .btn:active { transform: scale(.96); }
</style>
</head>
<body>

<button class="btn" id="goBtn">▶ মুভি দেখুন</button>

<script>
document.getElementById("goBtn").addEventListener("click", function () {
    var url = "https://movielinkbd.tv";

    // Median.co / GoNative Bridge — অ্যাপের WebView-এর ভেতরে খুলবে
    if (window.median && median.window) {
        median.window.open(url, "internal");
    } else if (window.gonative && gonative.window) {
        gonative.window.open(url, "internal");
    } else {
        // সাধারণ ব্রাউজারে টেস্ট করার সময়
        window.location.href = url;
    }
});
</script>

</body>
</html>
