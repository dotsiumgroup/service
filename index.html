<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>চালিয়ে যান</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;}
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;background:#0a1f26;color:#fff;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    overflow:hidden;
  }
  .wrap{
    display:flex;flex-direction:column;align-items:center;gap:24px;
    padding:30px;text-align:center;
  }
  .title{
    font-size:20px;font-weight:700;
    background:linear-gradient(100deg,#81d4fa,#fff,#c8a8ff);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .btn{
    background:linear-gradient(135deg,#e2136e,#ff4f9a);
    color:#fff;border:0;padding:18px 48px;border-radius:14px;
    font-size:18px;font-weight:700;font-family:inherit;
    cursor:pointer;
    box-shadow:0 14px 30px -14px rgba(226,19,110,.7);
    transition:transform .15s;
  }
  .btn:active{transform:scale(.96);}
</style>
</head>
<body>

<div class="wrap">
  <p class="title">চালিয়ে যেতে নিচের বাটনে চাপ দিন</p>
  <button class="btn" id="goBtn">▶ মুভি দেখুন</button>
</div>

<script>
document.getElementById("goBtn").addEventListener("click", function () {
  window.location.href = "https://movielinkbd.tv/";
});
</script>

</body>
</html>
